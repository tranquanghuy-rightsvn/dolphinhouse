<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Quản trị Dolphin House</title>
<link rel="icon" href="/assets/images/site/favicon.png">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #f3f5f7; font-family: Tahoma, Arial, sans-serif; }
  /* The frame provider paints a 25px notice bar above the app; the frame is
     shifted up by exactly that much so it never shows. Re-measure if the
     provider changes its layout. */
  :root { --notice-height: 25px; }
  .cms-viewport { position: fixed; inset: 0; overflow: hidden; }
  .cms-frame {
    position: absolute; left: 0; border: 0; display: block;
    top: calc(var(--notice-height) * -1);
    width: 100%; height: calc(100% + var(--notice-height));
  }
  /* Status layer sits ON TOP of the frame — a blank screen with no way out is
     worse than any styling problem. */
  .cms-status {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #f3f5f7; text-align: center; color: #263238;
  }
  .cms-status.hidden { display: none; }
  .cms-status .box { max-width: 420px; }
  .cms-status h1 { font-size: 18px; margin: 0 0 8px; }
  .cms-status p { color: #6b7280; margin: 0 0 16px; line-height: 1.6; }
  .cms-status a {
    display: inline-block; background: #4f1c78; color: #fff; text-decoration: none;
    font-weight: 700; padding: 10px 18px; border-radius: 10px;
  }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 14px; border-radius: 50%;
    border: 3px solid #dfe5e5; border-top-color: #0f5b5d; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="cms-viewport"><iframe class="cms-frame" id="cms-frame" title="Quản trị Dolphin House"></iframe></div>

<div class="cms-status" id="cms-status">
  <div class="box">
    <div class="spinner" id="cms-spinner"></div>
    <h1 id="cms-status-title">Đang mở trang quản trị…</h1>
    <p id="cms-status-text">Vui lòng đợi trong giây lát.</p>
    <a id="cms-fallback-link" href="/admin-gas/" rel="nofollow noreferrer" hidden>Mở theo cách khác</a>
  </div>
</div>

<script src="/js/cms-config.js"></script>
<script>
  (function () {
    var frame = document.getElementById("cms-frame");
    var status = document.getElementById("cms-status");
    var url = window.DH_CMS_URL || "";

    function fail(title, text) {
      document.getElementById("cms-spinner").hidden = true;
      document.getElementById("cms-status-title").textContent = title;
      document.getElementById("cms-status-text").textContent = text;
      document.getElementById("cms-fallback-link").hidden = false;
      status.classList.remove("hidden");
    }

    if (url.indexOf("http") !== 0) {
      fail("Chưa cấu hình trang quản trị", "Địa chỉ dịch vụ quản trị chưa được điền trong /js/cms-config.js.");
      return;
    }

    var loaded = false;
    // This event still fires for cross-origin content, so it is a reliable
    // "the frame got something" signal even though its contents are opaque.
    frame.addEventListener("load", function () {
      loaded = true;
      status.classList.add("hidden");
    });
    setTimeout(function () {
      if (loaded) return;
      fail(
        "Trình duyệt này chưa mở được trang quản trị",
        "Một số tài khoản Google của tổ chức chặn cách hiển thị này. Hãy mở theo cách khác bên dưới, hoặc dùng trình duyệt đang đăng nhập Gmail cá nhân."
      );
    }, 12000);

    frame.src = url;
  })();
</script>
</body>
</html>
