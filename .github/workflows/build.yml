name: Build site from data

# Only the index files are listed on purpose: saving one record in the admin
# writes several files in a row (images → detail → index), and the index is
# always the LAST write of the operation. Triggering on `data/**` would start a
# build halfway through and publish a half-updated site.
on:
  push:
    branches: [master]
    paths:
      - 'data/products.json'
      - 'data/product-categories.json'
      - 'data/news.json'
      - 'data/news-categories.json'
      - 'data/videos.json'
      - 'html/scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# Two admin saves seconds apart queue two runs. Superseding the older one is
# always safe: a later run rebuilds from newer data and produces everything the
# older one would have.
concurrency:
  group: build-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Generated pages are never merged: each attempt throws away local state,
      # rebuilds from the newest data on the branch, and retries if the remote
      # moved while it was building. Merging or rebasing them instead (the
      # previous approach) conflicts as soon as two admin saves land close
      # together — and a failed publish leaves the page of a deleted record
      # online, which is exactly what this pipeline exists to prevent.
      - name: Build and publish generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            (cd html && node scripts/build.mjs)
            git add html
            if git diff --cached --quiet; then
              echo "No page changes."
              exit 0
            fi
            git commit -m "CI: build html from data"
            if git push origin HEAD:master; then
              echo "Published on attempt $attempt."
              exit 0
            fi
            echo "Remote moved while building — rebuilding (attempt $attempt)."
          done
          echo "Could not publish after 5 attempts."
          exit 1
